name: Build m17-hotspot-os

on:
  push:
    branches: [main]
  pull_request:
  # Weekly: rebuild when the kernel or this repository changed, or when the
  # last release is a month old (to pick up Alpine security updates)
  schedule:
    - cron: '0 3 * * 1'
  # A manual run always builds and releases
  workflow_dispatch:
    inputs:
      rollback_test:
        description: "Rollback test: a pre-release that always fails its health check (never marked latest, so no hotspot installs it by itself)"
        type: boolean
        default: false

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6

      - name: Unit tests
        run: docker run --rm -v "$PWD":/repo:ro alpine:3.23 sh /repo/tests/unit.sh

      - name: Root filesystem smoke test
        run: sh tests/run-smoke.sh

      - name: ShellCheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          # SC2034: variables set here are read by the sourced libraries
          shellcheck -s sh -S warning -e SC2034 \
            scripts/*.sh tests/*.sh \
            overlay/usr/local/bin/* overlay/usr/local/lib/m17os/*.sh \
            overlay/usr/local/libexec/m17os/* overlay/etc/m17os/health.d/* \
            overlay/etc/periodic/daily/*
          shellcheck -s sh -S warning -e SC2034,SC2154 overlay/etc/init.d/*

  check:
    # Decides whether this run should build and release an image
    runs-on: ubuntu-24.04
    outputs:
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@v6
      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual run - releasing"; echo "release=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "release=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          . ./build.conf
          MANIFEST=$(curl -sfL "https://github.com/${{ github.repository }}/releases/latest/download/manifest.txt" || true)
          built_kernel=$(echo "$MANIFEST" | sed -n 's/^RASPINE_KERNEL=//p')
          built_commit=$(echo "$MANIFEST" | sed -n 's/^BUILD_COMMIT=//p')
          built_date=$(echo "$MANIFEST" | sed -n 's/^BUILD_DATE=//p')
          latest_kernel=$(curl -fsSL "$RASPINE_REPO/v$ALPINE_VERSION/community/$ALPINE_ARCH/APKINDEX.tar.gz" \
            | tar -xzO APKINDEX | awk '/^P:raspios-kernel-v8$/ { getline; sub(/^V:/, ""); print; exit }')
          # The M17 packages, in the same "name-version ..." form the
          # manifest records
          built_m17=$(echo "$MANIFEST" | sed -n 's/^M17_PACKAGES=//p')
          m17_index=$(curl -fsSL "$M17_APK_REPO/v$ALPINE_VERSION/m17/$ALPINE_ARCH/APKINDEX.tar.gz" | tar -xzO APKINDEX)
          latest_m17=$(for p in m17-gateway m17-gateway-openrc m17-firmware-cc1200 \
            m17-firmware-mmdvm-hs m17-firmware-mmdvm m17-sx1255-overlay m17-web m17-web-openrc; do
            printf '%s-%s ' "$p" "$(echo "$m17_index" | awk -v p="P:$p" '$0 == p { getline; sub(/^V:/, ""); print; exit }')"
            done | sed 's/ $//')
          age_days=999
          [ -n "$built_date" ] && age_days=$(( ( $(date -u +%s) - $(date -u -d "$built_date" +%s) ) / 86400 ))
          echo "Last release: kernel ${built_kernel:-?}, commit ${built_commit:-?}, ${age_days} days old"
          echo "Now:          kernel ${latest_kernel:-?}, commit ${{ github.sha }}"
          echo "M17 packages: ${built_m17:-?}"
          echo "         now: ${latest_m17:-?}"
          if [ -z "$built_kernel" ] || [ "$built_kernel" != "$latest_kernel" ] \
             || [ "$built_m17" != "$latest_m17" ] \
             || [ "$built_commit" != "${{ github.sha }}" ] || [ "$age_days" -ge 30 ]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nothing changed - skipping"; echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: [test, check]
    # Pull requests and pushes build too (no release) so image problems show up early
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Version
        run: |
          # YYYY.MM.DD.N - N is the release number for that day, from 1
          prefix=$(date -u +%Y.%m.%d)
          last=$(git ls-remote --tags origin "refs/tags/${prefix}.*" \
            | sed -n "s|.*refs/tags/${prefix}\.\([0-9][0-9]*\)$|\1|p" | sort -n | tail -1)
          echo "VERSION=${prefix}.$(( ${last:-0} + 1 ))" >> "$GITHUB_ENV"

      - name: Build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq parted dosfstools e2fsprogs curl xz-utils zstd git rsync fdisk util-linux binutils minisign

      # A build that boots but never passes its health check, to watch the
      # boot watchdog roll back. Install it by hand with
      #   doas env M17OS_CONF=<conf with UPDATE_URL=.../releases/download/TAG> m17os-upgrade --install
      - name: Rollback test hook
        if: inputs.rollback_test
        run: |
          cat > overlay/etc/m17os/health.d/99-rollback-test <<'HOOK'
          #!/bin/sh
          # Rollback test build: this slot must never be marked good
          echo "rollback test build: always fails"
          exit 1
          HOOK
          chmod 755 overlay/etc/m17os/health.d/99-rollback-test

      - name: Build image
        env:
          BUILD_COMMIT: ${{ github.sha }}
        run: sudo --preserve-env=BUILD_COMMIT scripts/build-image.sh "$VERSION" out

      # Only releases are signed, so pushes and pull requests (including
      # from forks, which get no secrets) build without the key
      - name: Sign manifest
        if: hashFiles('keys/release.pub') != '' && needs.check.outputs.release == 'true' && github.ref == 'refs/heads/main'
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          if [ -z "$MINISIGN_SECRET_KEY" ]; then
            echo "::error::keys/release.pub is in the repository, so images only accept signed updates, but the MINISIGN_SECRET_KEY secret is not set"
            exit 1
          fi
          umask 077
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$RUNNER_TEMP/release.key"
          sudo chown -R "$(id -u):$(id -g)" out
          minisign -S -s "$RUNNER_TEMP/release.key" -m out/manifest.txt -x out/manifest.txt.minisig \
            -t "m17-hotspot-os $VERSION" < /dev/null
          minisign -V -p keys/release.pub -m out/manifest.txt
          rm -f "$RUNNER_TEMP/release.key"

      - uses: actions/upload-artifact@v7
        with:
          name: m17-hotspot-os-${{ env.VERSION }}
          path: out/
          retention-days: 30

      - name: Release
        if: needs.check.outputs.release == 'true' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: m17-hotspot-os ${{ env.VERSION }}${{ inputs.rollback_test && ' (rollback test - do not install)' || '' }}
          prerelease: ${{ inputs.rollback_test == true }}
          make_latest: ${{ inputs.rollback_test && 'false' || 'true' }}
          files: out/*
          body: |
            ${{ inputs.rollback_test && '**Rollback test build. Do not install.** It always fails its health check, so a hotspot that boots it returns to its previous slot after three tries.' || '' }}

            # m17-hotspot-os ${{ env.VERSION }}

            Alpine Linux with the Raspberry Pi OS kernel, m17-gateway and the M17 web dashboard,
            for Raspberry Pi Zero 2 W, 3, 4 and 5 with a CC1200, SX1255 or MMDVM HAT.

            - **First install:** write `m17-hotspot-os-${{ env.VERSION }}.img.xz` to an SD card
              (Raspberry Pi Imager or balenaEtcher can write it directly).
            - **Update a running hotspot:** `doas m17os-upgrade --install`, then reboot.

            See the [README](https://github.com/${{ github.repository }}#readme) for setup.
