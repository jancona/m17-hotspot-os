# m17-hotspot-os build configuration
# Sourced by scripts/build-image.sh. Values already set in the environment win,
# so CI or a local build can override any of them.

# Base system
: "${ALPINE_VERSION:=3.23}"
: "${ALPINE_ARCH:=aarch64}"
: "${RASPINE_REPO:=https://raspine.pistar.uk}"

# Image layout (msdos label, 4 partitions)
#   P1 boot   FAT32  1MiB      .. BOOT_END    firmware, config.txt, slotA/ slotB/
#   P2 slot A ext4   BOOT_END  .. SLOT_A_END
#   P3 slot B ext4   SLOT_A_END .. SLOT_B_END
#   P4 data   ext4   SLOT_B_END .. end        grows to fill the card on first boot
: "${IMAGE_SIZE:=3500M}"
: "${BOOT_END:=257MiB}"
: "${SLOT_A_END:=1793MiB}"
: "${SLOT_B_END:=3329MiB}"

# M17 software (m17-gateway, m17-web, HAT firmware) comes from the
# m17-apk package repository, signed with keys/m17-apk.rsa.pub. Its
# versions are set there; each image records what it got in its manifest.
: "${M17_APK_REPO:=https://jancona.github.io/m17-apk}"

# Defaults written into the image
: "${DEFAULT_HOSTNAME:=m17-hotspot}"
: "${DEFAULT_USER:=m17}"
: "${DEFAULT_PASSWORD:=m17hotspot}"
: "${DEFAULT_WIFI_COUNTRY:=US}"

# Release naming
: "${IMAGE_NAME:=m17-hotspot-os}"
