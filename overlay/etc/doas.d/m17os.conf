# Administrators (group wheel) may run anything
permit nopass :wheel
# The web dashboard may control m17-gateway and reboot or shut down
permit nopass www-data as root cmd /usr/local/libexec/m17os/service-control
# The setup wizard (m17-web, packaged in m17-apk) may run its helper
permit nopass m17-web as root cmd /usr/local/libexec/m17os/admin-helper
