# m17-hotspot-os system configuration
# Belongs to the slot: replaced by every OS upgrade. Settings that must
# survive upgrades go in /data.

# Where m17os-upgrade finds manifest.txt and the rootfs tarballs
UPDATE_URL="https://github.com/jancona/m17-hotspot-os/releases/latest/download"
MANIFEST_FILE="manifest.txt"

# If this key exists, the manifest must carry a valid minisign signature
# (manifest.txt.minisig), and the rootfs must match the manifest's checksum.
RELEASE_PUBKEY="/etc/m17os/release.pub"

# Boot watchdog: roll back after this many boots of a pending slot
MAX_BOOT_TRIES=3

# Health check for a newly installed slot
HEALTH_TIMEOUT=180
HEALTH_INTERVAL=5
# Reboot when the health check fails, so the watchdog counts the attempt
# and rolls back after MAX_BOOT_TRIES. Without it a slot that boots but
# isn't healthy stays pending until someone reboots it.
HEALTH_FAIL_REBOOT=true
