# Mosquitto for m17-hotspot-os (/etc/conf.d/mosquitto points here).
#
# m17-gateway publishes its status here ([MQTT] in m17-gateway.ini) and
# m17-web subscribes to it. Nothing is kept on the SD card: the gateway
# republishes its state (modem, mode, reflector link) whenever it
# reconnects, so a restarted broker catches up within seconds.

per_listener_settings true
persistence false
log_dest syslog
log_type error
log_type warning
log_type notice
connection_messages false

# Programs on the hotspot: anything goes
listener 1883 127.0.0.1
allow_anonymous true

# Browsers, through nginx at /mqtt: read-only, and only the gateway's topics
listener 9001 127.0.0.1
protocol websockets
allow_anonymous true
acl_file /etc/mosquitto/m17os-websockets.acl
